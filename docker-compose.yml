services:
  web:
    build: .
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GROQ_MODEL=${GROQ_MODEL:-openai/gpt-oss-20b}
    volumes:
      - uploads_data:/app/backend/uploads
      - data_data:/app/backend/data

volumes:
  uploads_data:
  data_data:
