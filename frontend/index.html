<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ModeMint — AI Fashion Studio</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: radial-gradient(rgba(255,255,255,0.03) 1px, transparent 1px);
      background-size: 32px 32px;
      pointer-events: none;
      z-index: 0;
    }
    .grid-pattern {
      background-image:
        linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
      background-size: 48px 48px;
    }
  </style>
</head>
<body class="bg-[#09090b] text-zinc-50 font-sans antialiased min-h-screen flex flex-col relative">
  <header class="relative z-10 px-6 py-5 flex items-center justify-between">
    <div class="flex items-center gap-2.5">
      <div class="h-2 w-2 rounded-full bg-zinc-50"></div>
      <span class="text-sm font-semibold tracking-tight">ModeMint</span>
    </div>
    <a href="studio.html" class="text-sm text-zinc-400 hover:text-zinc-50 transition-colors">
      Enter Studio &rarr;
    </a>
  </header>

  <main class="relative z-10 flex-1 flex items-center justify-center px-6">
    <div class="text-center max-w-lg">
      <span class="inline-flex items-center rounded-full border border-zinc-800 px-3 py-1 text-xs text-zinc-400 mb-6">
        AI-Powered Styling Studio
      </span>
      <h1 class="text-5xl md:text-7xl font-bold tracking-tighter leading-none mb-5">
        ModeMint
      </h1>
      <p class="text-zinc-400 text-base md:text-lg leading-relaxed mb-8">
        Generate outfits, curate your wardrobe, browse trend signals, and get personalized styling advice &mdash; all in one workspace.
      </p>
      <a href="studio.html" class="inline-flex items-center gap-2 rounded-lg bg-white px-6 py-3 text-sm font-medium text-black hover:bg-zinc-200 transition-colors">
        Open Studio
        <i data-lucide="arrow-right" class="h-4 w-4"></i>
      </a>
    </div>
  </main>

  <footer class="relative z-10 px-6 py-4 text-center text-xs text-zinc-600">
    &copy; 2026 ModeMint &mdash; AI Fashion Outfit Studio
  </footer>

  <script>lucide.createIcons()</script>
</body>
</html>
